{% extends 'estoque/base.html' %}{% block content %}<div class="row justify-content-center mt-4"><div class="col-lg-7"><div class="card panel-pink"><div class="card-body"><h1 class="text-center page-title">Entrada de Mercadoria</h1><form method="post" class="mt-4" novalidate>{% csrf_token %}{% for field in form %}<div class="mb-3"><label class="form-label" for="{{ field.id_for_label }}">{{ field.label }}:</label>{{ field }}{% for error in field.errors %}<div class="text-danger" role="alert">{{ error }}</div>{% endfor %}</div>{% endfor %}<div class="d-flex justify-content-end"><button type="submit" class="btn btn-success">Salvar</button></div></form></div></div></div></div>{% endblock %}
